[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "perspektive-content"
version = "0.1.0"
description = "Automation pipeline for generating video and photo content for multiple companies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Perspektive Agency", email = "info@perspektiveagency.com" }]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
google = ["google-genai>=0.3"]
runway = ["runwayml>=2.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]
all = ["openai>=1.30", "google-genai>=0.3", "runwayml>=2.0"]

[project.scripts]
perspektive = "perspektive.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/perspektive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
